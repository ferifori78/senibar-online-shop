# ==========================================================================
# Senobar — Nginx: serves the built SPA and proxies the API
# ==========================================================================

upstream senobar_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Product photographs, straight off a camera. Must stay above Django's
    # MAX_IMAGE_UPLOAD_BYTES (25MB) with room for the rest of the multipart
    # form, or nginx rejects the upload with a 413 before Django can say
    # anything useful about it. The server shrinks the file after it lands.
    client_max_body_size 32m;

    # --- Compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff2;

    # --- Security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- API --------------------------------------------------------------
    location /api/ {
        proxy_pass http://senobar_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # The Senobar panel is a client-side route: `location /` below already
    # serves index.html for it. This block only keeps it out of search results
    # — the API enforces staff-only access regardless.
    location /senobar-panel/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    # Django admin and the files it needs.
    location /admin/ {
        proxy_pass http://senobar_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # --- Static assets ----------------------------------------------------
    # Vite fingerprints filenames, so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(woff2|woff|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- SPA --------------------------------------------------------------
    # index.html must never be cached, or a deploy leaves browsers asking for
    # asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Vue Router owns the URL space: unknown paths render the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
